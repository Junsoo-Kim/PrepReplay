[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prepreplay"
version = "0.1.0"
description = "로컬 영상(컨설팅/설명회/강의/면접 녹화)을 스크립트+프레임으로 분해해 Claude에 붙여넣을 수 있게 만드는 CLI 도구"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Junsoo-Kim" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
# GPU 가속용 CUDA 런타임 라이브러리. 용량이 크고(수백MB~1GB+) GPU가 없으면
# 필요 없으므로 기본 의존성에서 분리한다. 없어도 CPU 모드로 정상 동작한다.
gpu = [
    "nvidia-cublas-cu12>=12.0",
    "nvidia-cudnn-cu12>=9.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
prepreplay = "prepreplay.cli:app"

[tool.setuptools.packages.find]
include = ["prepreplay*"]

[tool.setuptools.package-data]
# 모드별 프롬프트 템플릿. -e 설치에서는 없어도 소스 경로로 바로 읽히지만,
# 일반(비-editable) 설치본에도 포함되도록 명시한다.
prepreplay = ["templates/*.md"]
