[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prepreplay"
version = "0.1.0"
description = "로컬 영상(컨설팅/설명회/강의/면접 녹화)을 스크립트+프레임으로 분해해 Claude에 붙여넣을 수 있게 만드는 CLI 도구"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Junsoo-Kim" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
prepreplay = "prepreplay.cli:app"

[tool.setuptools.packages.find]
include = ["prepreplay*"]
